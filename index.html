<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Funcionários</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Sistema de Gestão de Funcionários</h1>

    <section id="formulario-container">
        <h2>Cadastro de Funcionário</h2>
        
        <form id="funcionario-form">
            <input type="hidden" id="funcionario-id"> 
            
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required> </div>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="18" required> </div>
            <div>
                <label for="cargo">Cargo:</label>
                <input type="text" id="cargo" required> </div>
            <div>
                <label for="salario">Salário (R$):</label>
                <input type="number" id="salario" min="0" step="0.01" required> </div>
            
            <button type="submit" id="btn-cadastrar">Cadastrar</button>
            <button type="button" id="btn-cancelar" style="display:none;">Cancelar Edição</button>
        </form>
    </section>

    <section id="listagem-container">
        <h2>Lista de Funcionários</h2>
        <table id="funcionarios-tabela"> 
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Cargo</th>
                    <th>Salário (R$)</th>
                    <th>Ações</th> </tr>
            </thead>
            <tbody id="funcionarios-corpo">
                </tbody>
        </table>
    </section>
    
    <section id="relatorios-container">
        <h2>Relatórios</h2>
        <button id="relatorio-salario">Salário > R$ 5000</button>
        <button id="relatorio-media">Média Salarial</button>
        <button id="relatorio-cargos">Cargos Únicos</button>
        <button id="relatorio-maiusculo">Nomes em Maiúsculo</button>
        
        <div id="relatorio-resultado"></div>
    </section>

    <script src="js/Funcionario.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
